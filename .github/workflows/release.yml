name: Modules
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/release_modules.py build
      - run: python -m unittest discover -s tools -p test_modules.py
      - run: python tools/release_modules.py verify
      - name: Generated catalog is committed
        run: git diff --exit-code -- registry tools/module-versions.json
      - name: Release tag matches catalog version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/upload-artifact@v4
        with:
          name: light-modules
          path: dist/*
          if-no-files-found: error
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: light-modules, path: dist }
      - name: Sign the verified module catalog
        env:
          LIGHT_UPDATE_SIGNING_KEY: ${{ secrets.LIGHT_UPDATE_SIGNING_KEY }}
        run: |
          python -m pip install -r tools/update-signing-requirements.txt
          python tools/sign_updates.py --kind modules --version "${GITHUB_REF_NAME#v}" --directory dist
          python - <<'PY_CHECKSUMS'
          import hashlib
          from pathlib import Path
          files = sorted(p for p in Path('dist').iterdir() if p.is_file() and p.name != 'SHA256SUMS.txt')
          Path('dist/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          PY_CHECKSUMS
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Official language and tool modules for Light IDE 1.1.0 and newer. Includes individual versioned ZIPs, the catalog, a complete offline registry and SHA-256 checksums.\n\nModule sources and original licenses are preserved in this repository and in every package.\n' > NOTES.md
          gh release create "$GITHUB_REF_NAME" dist/* --target "$GITHUB_SHA" --title "Light Modules ${GITHUB_REF_NAME#v}" --notes-file NOTES.md
